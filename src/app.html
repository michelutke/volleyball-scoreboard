<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#0a0a0a" />
		<meta name="description" content="Live-Volleyball-Scoring und Stream-Overlays für Clubs. Ball is in." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Scorely" />
		<meta property="og:title" content="Scorely. Ball is in." />
		<meta property="og:description" content="Live-Volleyball-Scoring und Stream-Overlays für Clubs." />
		<meta property="og:url" content="https://scorely.ch/" />
		<meta property="og:image" content="https://scorely.ch/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Scorely. Ball is in." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Scorely. Ball is in." />
		<meta name="twitter:description" content="Live-Volleyball-Scoring und Stream-Overlays für Clubs." />
		<meta name="twitter:image" content="https://scorely.ch/og-image.png" />
		<script nonce="%sveltekit.nonce%">
			(function () {
				function readCookie(name) {
					var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
					return m ? decodeURIComponent(m[1]) : null;
				}
				var t = readCookie('scoring-theme') || localStorage.getItem('theme');
				var resolved;
				if (t === 'light' || t === 'dark') resolved = t;
				else resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				document.documentElement.dataset.theme = resolved;

				var m = readCookie('scoring-motion');
				if (m === 'full' || m === 'damped' || m === 'static') {
					document.documentElement.dataset.motion = m;
				} else {
					document.documentElement.removeAttribute('data-motion');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
